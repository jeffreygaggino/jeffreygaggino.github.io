<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    <link rel="icon" type="image/png" href="/icon-512.png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Jeffrey Gaggino</title>
    <meta
      name="description"
      content="Jeffrey Gaggino. Technical Lead building internal tools and customer-facing systems."
    />
    <link rel="canonical" href="https://jeffreygaggino.github.io/" />

    <!--
      Link previews. Scrapers read the served HTML and never run the app, so
      these have to sit here rather than come from a component, and every URL
      has to be absolute. The image is the same face the site opens with, so a
      shared link looks like the page it lands on. It is square, hence the
      "summary" card rather than a wide one.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jeffrey Gaggino" />
    <meta property="og:url" content="https://jeffreygaggino.github.io/" />
    <meta property="og:title" content="Jeffrey Gaggino" />
    <meta
      property="og:description"
      content="Jeffrey Gaggino. Technical Lead building internal tools and customer-facing systems."
    />
    <meta
      property="og:image"
      content="https://jeffreygaggino.github.io/icon-512.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="A drawing of Jeffrey Gaggino." />
    <meta name="twitter:card" content="summary" />
    <script>
      // Commits to a Theme before first paint so a light-theme visitor never
      // sees a dark flash. Dark is the default, so only an explicit stored
      // choice changes anything here.
      try {
        const stored = localStorage.getItem("theme");
        if (stored === "light" || stored === "dark") {
          document.documentElement.dataset.theme = stored;
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
