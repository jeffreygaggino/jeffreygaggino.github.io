<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jeffrey Gaggino</title>
    <meta
      name="description"
      content="Jeffrey Gaggino. Technical Lead building internal tools and customer-facing systems."
    />
    <script>
      // Commits to a Theme before first paint so a light-theme visitor never
      // sees a dark flash. Dark is the default, so only an explicit stored
      // choice changes anything here.
      try {
        const stored = localStorage.getItem("theme");
        if (stored === "light" || stored === "dark") {
          document.documentElement.dataset.theme = stored;
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
